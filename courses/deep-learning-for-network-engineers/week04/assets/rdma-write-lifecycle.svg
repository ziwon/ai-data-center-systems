<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">RDMA write lifecycle</title>
  <desc id="desc">A technical diagram showing RDMA memory registration, queue pair setup, connection initiation, work request posting, packet encapsulation, and remote memory write completion.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .bg { fill: #F3EFE7; }
      .panel { fill: none; stroke: #D8D1C7; stroke-width: 1.2; }
      .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
      .soft { fill: #F5F1EA; stroke: #D8D1C7; stroke-width: 1.1; }
      .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
      .line { fill: none; stroke: #111111; stroke-width: 1.8; }
      .loss { fill: none; stroke: #D9392E; stroke-width: 2; }
      .dash { fill: none; stroke: #6F6A63; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .label { font-size: 16px; font-weight: 700; fill: #050505; }
      .small { font-size: 13px; fill: #6F6A63; }
      .tiny { font-size: 12px; fill: #6F6A63; }
      .key { font-size: 13px; font-weight: 700; fill: #D9392E; }
      .arrow { fill: #111111; }
      .arrow-accent { fill: #D9392E; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="520"/>

  <rect class="panel" x="44" y="42" width="428" height="420" rx="8"/>
  <rect class="panel" x="648" y="42" width="428" height="420" rx="8"/>
  <text class="label" x="70" y="76">Client compute node</text>
  <text class="small" x="70" y="98">source GPU memory and local RNIC</text>
  <text class="label" x="674" y="76">Server compute node</text>
  <text class="small" x="674" y="98">target GPU memory and remote RNIC</text>

  <rect class="soft" x="80" y="128" width="170" height="56" rx="6"/>
  <text class="label" x="112" y="153">Allocate PD</text>
  <text class="tiny" x="108" y="171">object isolation</text>

  <rect class="soft" x="286" y="128" width="170" height="56" rx="6"/>
  <text class="label" x="322" y="153">Register MR</text>
  <text class="tiny" x="326" y="171">Local Read</text>

  <rect class="box" x="112" y="224" width="268" height="72" rx="7"/>
  <text class="label" x="147" y="251">Create QP and CQ</text>
  <text class="tiny" x="154" y="272">Send Queue + Receive Queue</text>

  <rect class="soft" x="684" y="128" width="170" height="56" rx="6"/>
  <text class="label" x="716" y="153">Allocate PD</text>
  <text class="tiny" x="714" y="171">same RDMA domain</text>

  <rect class="accent" x="890" y="128" width="170" height="56" rx="6"/>
  <text class="label" x="926" y="153">Register MR</text>
  <text class="tiny" x="914" y="171">Remote Write enabled</text>

  <rect class="box" x="716" y="224" width="268" height="72" rx="7"/>
  <text class="label" x="751" y="251">Create QP and CQ</text>
  <text class="tiny" x="766" y="272">validate P_Key and R_Key</text>

  <line class="line" x1="250" y1="156" x2="280" y2="156"/>
  <polygon class="arrow" points="280,156 269,150 269,162"/>
  <line class="line" x1="164" y1="184" x2="164" y2="218"/>
  <polygon class="arrow" points="164,218 158,207 170,207"/>
  <line class="line" x1="371" y1="184" x2="371" y2="218"/>
  <polygon class="arrow" points="371,218 365,207 377,207"/>

  <line class="line" x1="854" y1="156" x2="884" y2="156"/>
  <polygon class="arrow" points="884,156 873,150 873,162"/>
  <line class="line" x1="769" y1="184" x2="769" y2="218"/>
  <polygon class="arrow" points="769,218 763,207 775,207"/>
  <line class="line" x1="975" y1="184" x2="975" y2="218"/>
  <polygon class="arrow" points="975,218 969,207 981,207"/>

  <path class="dash" d="M 380 260 C 474 210, 568 210, 716 260"/>
  <polygon class="arrow" points="716,260 704,254 705,267"/>
  <rect class="bg" x="484" y="197" width="154" height="38" rx="5"/>
  <text class="small" x="494" y="210">REQ / REP / RTU</text>
  <text class="tiny" x="472" y="230">LID, CA GUID, QP, PSN, P_Key</text>

  <rect class="accent" x="82" y="356" width="230" height="62" rx="7"/>
  <text class="label" x="112" y="382">Post Work Request</text>
  <text class="tiny" x="104" y="402">OpCode, L_Key, remote addr, R_Key</text>

  <rect class="box" x="358" y="356" width="182" height="62" rx="7"/>
  <text class="label" x="404" y="382">Local RNIC</text>
  <text class="tiny" x="390" y="402">build BTH and RETH</text>

  <rect class="accent" x="584" y="356" width="182" height="62" rx="7"/>
  <text class="label" x="620" y="382">UDP 4791</text>
  <text class="tiny" x="608" y="402">Eth/IP/UDP/BTH/RETH</text>

  <rect class="box" x="810" y="356" width="182" height="62" rx="7"/>
  <text class="label" x="856" y="382">Remote RNIC</text>
  <text class="tiny" x="830" y="402">write target device memory</text>

  <line class="line" x1="312" y1="387" x2="352" y2="387"/>
  <polygon class="arrow" points="352,387 341,381 341,393"/>
  <line class="line" x1="540" y1="387" x2="578" y2="387"/>
  <polygon class="arrow" points="578,387 567,381 567,393"/>
  <line class="loss" x1="766" y1="387" x2="804" y2="387"/>
  <polygon class="arrow-accent" points="804,387 793,381 793,393"/>

  <text class="key" x="604" y="450">Critical path: loss or congestion here stalls RDMA completion</text>
</svg>
