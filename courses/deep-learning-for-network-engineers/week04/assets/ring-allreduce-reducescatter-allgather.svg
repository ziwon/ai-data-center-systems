<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Ring AllReduce as ReduceScatter and AllGather</title>
  <desc id="desc">A technical diagram showing a four-rank ring AllReduce split into ReduceScatter and AllGather phases with gradient chunks A B C and D.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .bg { fill: #F3EFE7; }
      .panel { fill: none; stroke: #D8D1C7; stroke-width: 1.2; }
      .rank { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
      .accent-rank { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
      .chunk { fill: #F5F1EA; stroke: #D8D1C7; stroke-width: 1.1; }
      .chunk-hot { fill: #F5F1EA; stroke: #D9392E; stroke-width: 1.8; }
      .line { fill: none; stroke: #111111; stroke-width: 1.8; }
      .accent { fill: none; stroke: #D9392E; stroke-width: 2.2; }
      .dash { fill: none; stroke: #6F6A63; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .label { font-size: 16px; font-weight: 700; fill: #050505; }
      .small { font-size: 13px; fill: #6F6A63; }
      .tiny { font-size: 12px; fill: #6F6A63; }
      .red { font-size: 13px; font-weight: 700; fill: #D9392E; }
      .arrow { fill: #111111; }
      .arrow-red { fill: #D9392E; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="560"/>

  <rect class="panel" x="46" y="44" width="1032" height="132" rx="8"/>
  <text class="label" x="74" y="80">Gradient bucket</text>
  <text class="small" x="74" y="102">1024 gradients split into four 256-gradient chunks on every rank</text>

  <rect class="chunk" x="292" y="118" width="98" height="46" rx="6"/>
  <text class="label" x="333" y="147">A</text>
  <rect class="chunk" x="410" y="118" width="98" height="46" rx="6"/>
  <text class="label" x="451" y="147">B</text>
  <rect class="chunk" x="528" y="118" width="98" height="46" rx="6"/>
  <text class="label" x="569" y="147">C</text>
  <rect class="chunk" x="646" y="118" width="98" height="46" rx="6"/>
  <text class="label" x="687" y="147">D</text>
  <text class="tiny" x="790" y="145">each rank has A-D before AllReduce</text>

  <rect class="panel" x="46" y="220" width="480" height="324" rx="8"/>
  <rect class="panel" x="594" y="220" width="480" height="324" rx="8"/>
  <text class="label" x="74" y="254">ReduceScatter</text>
  <text class="small" x="74" y="276">sum chunks while they circulate around the ring</text>
  <text class="label" x="622" y="254">AllGather</text>
  <text class="small" x="622" y="276">redistribute fully reduced chunks to every rank</text>

  <rect class="accent-rank" x="116" y="316" width="106" height="60" rx="7"/>
  <text class="label" x="140" y="341">Rank 0</text>
  <text class="small" x="145" y="359">holds B</text>
  <rect class="rank" x="354" y="316" width="106" height="60" rx="7"/>
  <text class="label" x="378" y="341">Rank 1</text>
  <text class="small" x="383" y="359">holds C</text>
  <rect class="rank" x="354" y="438" width="106" height="60" rx="7"/>
  <text class="label" x="378" y="463">Rank 2</text>
  <text class="small" x="383" y="481">holds D</text>
  <rect class="rank" x="116" y="438" width="106" height="60" rx="7"/>
  <text class="label" x="140" y="463">Rank 3</text>
  <text class="small" x="145" y="481">holds A</text>

  <path class="accent" d="M 222 346 L 348 346"/>
  <polygon class="arrow-red" points="348,346 336,340 336,352"/>
  <path class="accent" d="M 407 376 L 407 432"/>
  <polygon class="arrow-red" points="407,432 401,420 413,420"/>
  <path class="accent" d="M 354 468 L 228 468"/>
  <polygon class="arrow-red" points="228,468 240,462 240,474"/>
  <path class="accent" d="M 169 438 L 169 382"/>
  <polygon class="arrow-red" points="169,382 163,394 175,394"/>
  <text class="red" x="234" y="407">N - 1 iterations</text>
  <text class="tiny" x="220" y="426">each rank ends with one reduced chunk</text>

  <rect class="rank" x="664" y="316" width="106" height="60" rx="7"/>
  <text class="label" x="688" y="341">Rank 0</text>
  <text class="small" x="685" y="359">A B C D</text>
  <rect class="rank" x="902" y="316" width="106" height="60" rx="7"/>
  <text class="label" x="926" y="341">Rank 1</text>
  <text class="small" x="923" y="359">A B C D</text>
  <rect class="rank" x="902" y="438" width="106" height="60" rx="7"/>
  <text class="label" x="926" y="463">Rank 2</text>
  <text class="small" x="923" y="481">A B C D</text>
  <rect class="rank" x="664" y="438" width="106" height="60" rx="7"/>
  <text class="label" x="688" y="463">Rank 3</text>
  <text class="small" x="685" y="481">A B C D</text>

  <path class="line" d="M 770 346 L 896 346"/>
  <polygon class="arrow" points="896,346 884,340 884,352"/>
  <path class="line" d="M 955 376 L 955 432"/>
  <polygon class="arrow" points="955,432 949,420 961,420"/>
  <path class="line" d="M 902 468 L 776 468"/>
  <polygon class="arrow" points="776,468 788,462 788,474"/>
  <path class="line" d="M 717 438 L 717 382"/>
  <polygon class="arrow" points="717,382 711,394 723,394"/>

  <rect class="chunk-hot" x="790" y="396" width="92" height="38" rx="6"/>
  <text class="label" x="807" y="421">full set</text>
  <text class="tiny" x="805" y="449">divide by GPU count locally</text>

  <path class="dash" d="M 526 382 C 552 366, 568 366, 594 382"/>
  <polygon class="arrow" points="594,382 582,376 582,389"/>
  <text class="tiny" x="524" y="358">phase boundary</text>
</svg>
