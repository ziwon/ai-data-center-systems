<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Work request message step 2</title>
  <desc id="desc">Redrawn server-side RDMA write processing showing NIC validation, P_Key, R_Key, queue pair, receive queue, virtual-to-physical address translation, completion queue, and application notification.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .bg { fill: #F3EFE7; }
      .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.3; }
      .soft { fill: #F5F1EA; stroke: #D8D1C7; stroke-width: 1.1; }
      .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
      .line { fill: none; stroke: #111111; stroke-width: 1.8; }
      .dash { fill: none; stroke: #6F6A63; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .red { fill: none; stroke: #D9392E; stroke-width: 2; }
      .label { font-size: 16px; font-weight: 700; fill: #050505; }
      .small { font-size: 13px; fill: #6F6A63; }
      .tiny { font-size: 12px; fill: #6F6A63; }
      .num { font-size: 13px; font-weight: 700; fill: #050505; }
      .arrow { fill: #111111; }
      .arrow-red { fill: #D9392E; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="520"/>

  <rect class="box" x="64" y="210" width="150" height="78" rx="8"/>
  <text class="label" x="122" y="242">NIC</text>
  <text class="small" x="88" y="264">receive RDMA Write</text>
  <circle class="soft" cx="62" cy="249" r="18"/>
  <text class="num" x="58" y="254">1</text>
  <line class="line" x1="24" y1="249" x2="64" y2="249"/>

  <rect class="soft" x="76" y="344" width="134" height="64" rx="8"/>
  <text class="label" x="116" y="370">P_Key</text>
  <text class="tiny" x="118" y="390">0x8012</text>
  <circle class="soft" cx="92" cy="324" r="18"/>
  <text class="num" x="88" y="329">2</text>
  <path class="dash" d="M 114 288 L 92 324 L 143 344"/>

  <rect class="soft" x="244" y="344" width="134" height="64" rx="8"/>
  <text class="label" x="286" y="370">R_Key</text>
  <text class="tiny" x="278" y="390">0x1234abba</text>
  <circle class="soft" cx="230" cy="324" r="18"/>
  <text class="num" x="226" y="329">3</text>
  <path class="dash" d="M 166 288 L 230 324 L 311 344"/>

  <rect class="accent" x="338" y="210" width="166" height="78" rx="8"/>
  <text class="label" x="376" y="240">Queue Pair</text>
  <text class="tiny" x="374" y="260">QP 0x87654321</text>
  <line class="line" x1="214" y1="249" x2="338" y2="249"/>
  <polygon class="arrow" points="338,249 326,243 326,255"/>

  <rect class="accent" x="566" y="202" width="236" height="70" rx="8"/>
  <text class="label" x="650" y="228">Receive Queue</text>
  <text class="tiny" x="634" y="248">incoming RDMA Write info</text>
  <line class="line" x1="504" y1="249" x2="566" y2="237"/>
  <polygon class="arrow" points="566,237 553,234 557,246"/>

  <rect class="soft" x="852" y="184" width="166" height="96" rx="8"/>
  <text class="label" x="874" y="224">Physical memory</text>
  <text class="small" x="878" y="246">allocated block</text>
  <circle class="soft" cx="812" cy="237" r="18"/>
  <text class="num" x="808" y="242">5</text>
  <line class="line" x1="802" y1="237" x2="852" y2="237"/>
  <polygon class="arrow" points="852,237 840,231 840,243"/>

  <text class="label" x="284" y="66">Translate virtual address to physical address</text>
  <circle class="soft" cx="258" cy="66" r="18"/>
  <text class="num" x="254" y="71">4</text>
  <path class="dash" d="M 421 210 L 421 66 L 936 66 L 936 184"/>
  <polygon class="arrow" points="936,184 930,172 942,172"/>

  <rect class="accent" x="550" y="372" width="258" height="70" rx="8"/>
  <text class="label" x="622" y="400">Completion Queue</text>
  <text class="tiny" x="624" y="420">signal successful completion</text>
  <path class="dash" d="M 686 272 L 686 372"/>
  <polygon class="arrow" points="686,372 680,360 692,360"/>

  <rect class="box" x="884" y="360" width="154" height="104" rx="8"/>
  <text class="label" x="918" y="404">Application</text>
  <text class="small" x="910" y="426">completion event</text>
  <circle class="soft" cx="836" cy="407" r="18"/>
  <text class="num" x="832" y="412">6</text>
  <line class="line" x1="808" y1="407" x2="884" y2="407"/>
  <polygon class="arrow" points="884,407 872,401 872,413"/>
</svg>
