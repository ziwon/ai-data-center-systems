<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Opening TCP socket with the master rank</title>
  <desc id="desc">Redrawn figure showing two GPU hosts, torchrun parameters, global rank calculation, and TCP rendezvous connections to master rank 0 over the frontend management network.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .bg { fill: #F5F1EA; }
      .host { fill: none; stroke: #111111; stroke-width: 1.3; }
      .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.2; }
      .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.1; }
      .code { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.1; }
      .rank { fill: #F5F1EA; stroke: #D8D1C7; stroke-width: 1.1; }
      .master { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
      .gpu { fill: #F5F1EA; stroke: #111111; stroke-width: 1.2; }
      .tcp { fill: none; stroke: #6F6A63; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .line { fill: none; stroke: #111111; stroke-width: 1.6; }
      .red { fill: none; stroke: #D9392E; stroke-width: 2; }
      .label { font-size: 16px; font-weight: 700; fill: #050505; }
      .small { font-size: 13px; fill: #6F6A63; }
      .tiny { font-size: 12px; fill: #6F6A63; }
      .mono { font-size: 13px; fill: #050505; font-family: monospace; }
      .accent-text { font-size: 13px; font-weight: 700; fill: #D9392E; }
      .arrow { fill: #111111; }
      .arrow-gray { fill: #6F6A63; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="620"/>
  <rect class="host" x="42" y="42" width="356" height="540" rx="8"/>
  <rect class="host" x="764" y="42" width="356" height="540" rx="8"/>
  <text class="label" x="170" y="72">Host A</text>
  <text class="small" x="72" y="94">IP 192.168.10.101, loopback 127.0.0.1</text>
  <text class="label" x="886" y="72">Host B: 192.168.10.102</text>

  <text class="label" x="430" y="106">Frontend / Management Network</text>
  <line class="line" x1="92" y1="130" x2="1070" y2="130"/>
  <line class="line" x1="92" y1="146" x2="1070" y2="146"/>

  <rect class="master" x="74" y="216" width="72" height="88" rx="5"/>
  <text class="label" x="92" y="239">R0</text>
  <text class="tiny" x="88" y="258">local 0</text>
  <rect class="gpu" x="74" y="304" width="72" height="42" rx="0"/>
  <text class="label" x="90" y="331">GPU 0</text>

  <rect class="rank" x="162" y="216" width="72" height="88" rx="5"/>
  <text class="label" x="180" y="239">R1</text>
  <text class="tiny" x="176" y="258">local 1</text>
  <rect class="gpu" x="162" y="304" width="72" height="42" rx="0"/>
  <text class="label" x="178" y="331">GPU 1</text>

  <rect class="rank" x="250" y="216" width="72" height="88" rx="5"/>
  <text class="label" x="268" y="239">R2</text>
  <text class="tiny" x="264" y="258">local 2</text>
  <rect class="gpu" x="250" y="304" width="72" height="42" rx="0"/>
  <text class="label" x="266" y="331">GPU 2</text>

  <rect class="rank" x="826" y="216" width="72" height="88" rx="5"/>
  <text class="label" x="844" y="239">R4</text>
  <text class="tiny" x="840" y="258">local 0</text>
  <rect class="gpu" x="826" y="304" width="72" height="42" rx="0"/>
  <text class="label" x="842" y="331">GPU 0</text>

  <rect class="rank" x="914" y="216" width="72" height="88" rx="5"/>
  <text class="label" x="932" y="239">R5</text>
  <text class="tiny" x="928" y="258">local 1</text>
  <rect class="gpu" x="914" y="304" width="72" height="42" rx="0"/>
  <text class="label" x="930" y="331">GPU 1</text>

  <rect class="rank" x="1002" y="216" width="72" height="88" rx="5"/>
  <text class="label" x="1020" y="239">R6</text>
  <text class="tiny" x="1016" y="258">local 2</text>
  <rect class="gpu" x="1002" y="304" width="72" height="42" rx="0"/>
  <text class="label" x="1018" y="331">GPU 2</text>

  <path class="tcp" d="M 198 216 C 186 176, 130 176, 110 216"/>
  <path class="tcp" d="M 286 216 C 256 160, 144 160, 110 216"/>
  <path class="tcp" d="M 862 216 C 694 106, 252 104, 110 216"/>
  <path class="tcp" d="M 950 216 C 744 92, 250 92, 110 216"/>
  <path class="tcp" d="M 1038 216 C 794 78, 248 78, 110 216"/>
  <polygon class="arrow-gray" points="110,216 117,204 123,217"/>
  <text class="small" x="444" y="174">Dst 192.168.10.101, TCP dst port 12345</text>
  <text class="small" x="450" y="194">Remote ranks use Host A master address</text>

  <rect class="box" x="390" y="372" width="380" height="58" rx="7"/>
  <text class="label" x="438" y="397">Global rank calculation</text>
  <text class="small" x="468" y="418">node_rank * processes_per_node + local_rank</text>

  <rect class="code" x="68" y="430" width="304" height="128" rx="7"/>
  <text class="mono" x="86" y="456">torchrun \</text>
  <text class="mono" x="86" y="478">  --nproc_per_node=4 \</text>
  <text class="mono" x="86" y="500">  --nnodes=2 \</text>
  <text class="mono" x="86" y="522">  --node_rank=0 \</text>
  <text class="mono" x="86" y="544">  --master_addr=192.168.10.101</text>

  <rect class="code" x="790" y="430" width="304" height="128" rx="7"/>
  <text class="mono" x="808" y="456">torchrun \</text>
  <text class="mono" x="808" y="478">  --nproc_per_node=4 \</text>
  <text class="mono" x="808" y="500">  --nnodes=2 \</text>
  <text class="mono" x="808" y="522">  --node_rank=1 \</text>
  <text class="mono" x="808" y="544">  --master_addr=192.168.10.101</text>

  <line class="line" x1="372" y1="494" x2="790" y2="494"/>
  <polygon class="arrow" points="790,494 778,488 778,500"/>
  <text class="accent-text" x="448" y="480">SSH/run script over frontend network</text>
</svg>
