<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Create queue pairs</title>
  <desc id="desc">Redrawn figure showing client and server compute nodes creating queue pairs, completion queues, partition keys, port LIDs, and NIC GUIDs.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .bg { fill: #F3EFE7; }
      .panel { fill: none; stroke: #111111; stroke-width: 1.3; }
      .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.2; }
      .soft { fill: #F5F1EA; stroke: #D8D1C7; stroke-width: 1.1; }
      .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
      .line { fill: none; stroke: #111111; stroke-width: 1.6; }
      .dash { fill: none; stroke: #6F6A63; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .red { fill: none; stroke: #D9392E; stroke-width: 2; }
      .label { font-size: 16px; font-weight: 700; fill: #050505; }
      .small { font-size: 13px; fill: #6F6A63; }
      .tiny { font-size: 12px; fill: #6F6A63; }
      .key { font-size: 13px; font-weight: 700; fill: #D9392E; }
      .arrow { fill: #111111; }
      .arrow-red { fill: #D9392E; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="620"/>
