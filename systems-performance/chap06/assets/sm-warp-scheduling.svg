<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Streaming multiprocessor warp scheduling</title>
  <desc id="desc">Ready warps feed multiple warp schedulers, which issue instructions to math and load-store pipelines backed by registers and cache or memory.</desc>
  <style>
    .bg { fill: #F3EFE7; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 2; }
    .key-box { fill: none; stroke: #D9392E; stroke-width: 3; }
    .line { fill: none; stroke: #111111; stroke-width: 2; marker-end: url(#arrow); }
    .bus { fill: none; stroke: #6F6A63; stroke-width: 2; }
    .label { fill: #050505; font: 600 21px Inter, Arial, sans-serif; text-anchor: middle; }
    .small { fill: #6F6A63; font: 16px Inter, Arial, sans-serif; text-anchor: middle; }
    .key { fill: #D9392E; font: 700 15px Inter, Arial, sans-serif; letter-spacing: 1px; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="680" rx="12"/>

  <rect class="box" x="35" y="270" width="210" height="110" rx="4"/>
  <text class="label" x="140" y="320">Ready warps</text>
  <text class="small" x="140" y="348">eligible to issue</text>

  <path class="bus" d="M245 325 H285 M285 95 V555"/>
  <path class="line" d="M285 95 H340"/>
  <path class="line" d="M285 245 H340"/>
  <path class="line" d="M285 395 H340"/>
  <path class="line" d="M285 545 H340"/>

  <g>
    <rect class="box" x="340" y="50" width="270" height="90" rx="4"/>
    <text class="label" x="475" y="92">Warp scheduler 0</text>
    <text class="small" x="475" y="117">select ready instruction</text>

    <rect class="box" x="340" y="200" width="270" height="90" rx="4"/>
    <text class="label" x="475" y="242">Warp scheduler 1</text>
    <text class="small" x="475" y="267">select ready instruction</text>

    <rect class="box" x="340" y="350" width="270" height="90" rx="4"/>
    <text class="label" x="475" y="392">Warp scheduler 2</text>
    <text class="small" x="475" y="417">select ready instruction</text>

    <rect class="box" x="340" y="500" width="270" height="90" rx="4"/>
    <text class="label" x="475" y="542">Warp scheduler 3</text>
    <text class="small" x="475" y="567">select ready instruction</text>
  </g>

  <path class="bus" d="M610 95 H655 M610 245 H655 M610 395 H655 M610 545 H655 M655 95 V545"/>
  <path class="line" d="M655 215 H720"/>
  <path class="line" d="M655 425 H720"/>

  <g>
    <rect class="key-box" x="720" y="155" width="235" height="120" rx="4"/>
    <text class="key" x="838" y="187">COMPUTE PATH</text>
    <text class="label" x="838" y="220">Math / Tensor</text>
    <text class="small" x="838" y="248">INT and FP pipelines</text>

    <rect class="box" x="720" y="365" width="235" height="120" rx="4"/>
    <text class="label" x="838" y="418">Load / store</text>
    <text class="small" x="838" y="446">memory pipeline</text>
  </g>

  <path class="line" d="M955 215 H1005"/>
  <path class="line" d="M955 425 H1005"/>

  <g>
    <rect class="box" x="1005" y="165" width="160" height="100" rx="4"/>
    <text class="label" x="1085" y="208">Registers</text>
    <text class="small" x="1085" y="235">operand state</text>

    <rect class="box" x="1005" y="365" width="160" height="120" rx="4"/>
    <text class="label" x="1085" y="408">L1 / shared</text>
    <text class="label" x="1085" y="438">L2 / HBM</text>
    <text class="small" x="1085" y="466">data hierarchy</text>
  </g>
</svg>
