<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Container image startup cost path</title>
  <desc id="desc">A diagram showing image pull, layer extraction, model cache warming, CUDA context initialization, and inference readiness.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .bg { fill: #F5F1EA; }
      .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
      .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
      .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
      .line { fill: none; stroke: #111111; stroke-width: 1.8; }
      .dash { fill: none; stroke: #6F6A63; stroke-width: 1.4; stroke-dasharray: 6 5; }
      .label { fill: #050505; font-size: 17px; font-weight: 700; }
      .small { fill: #6F6A63; font-size: 13px; }
      .red { fill: #D9392E; font-size: 13px; font-weight: 700; }
      .arrow { fill: #111111; }
      .arrow-red { fill: #D9392E; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="520"/>

  <rect class="box" x="54" y="110" width="170" height="90" rx="8"/>
  <text class="label" x="94" y="146">Image pull</text>
  <text class="small" x="84" y="170">registry to node</text>

  <rect class="soft" x="286" y="110" width="190" height="90" rx="8"/>
  <text class="label" x="326" y="146">Layer extract</text>
  <text class="small" x="316" y="170">OverlayFS metadata</text>

  <rect class="accent" x="538" y="110" width="190" height="90" rx="8"/>
  <text class="label" x="574" y="146">Model cache</text>
  <text class="small" x="572" y="170">volume or local NVMe</text>

  <rect class="soft" x="790" y="110" width="190" height="90" rx="8"/>
  <text class="label" x="828" y="146">CUDA context</text>
  <text class="small" x="828" y="170">driver and GPU ready</text>

  <line class="line" x1="224" y1="155" x2="286" y2="155"/>
  <polygon class="arrow" points="286,155 274,149 274,161"/>
  <line class="line" x1="476" y1="155" x2="538" y2="155"/>
  <polygon class="arrow" points="538,155 526,149 526,161"/>
  <line class="line" x1="728" y1="155" x2="790" y2="155"/>
  <polygon class="arrow" points="790,155 778,149 778,161"/>

  <rect class="soft" x="128" y="318" width="230" height="76" rx="8"/>
  <text class="label" x="180" y="348">Bad pattern</text>
  <text class="small" x="160" y="372">model weights inside image</text>

  <rect class="accent" x="458" y="318" width="230" height="76" rx="8"/>
  <text class="label" x="508" y="348">Better pattern</text>
  <text class="small" x="494" y="372">small image + warmed cache</text>

  <rect class="box" x="788" y="318" width="230" height="76" rx="8"/>
  <text class="label" x="842" y="348">Ready signal</text>
  <text class="small" x="830" y="372">separate cold-start budget</text>

  <path class="dash" d="M 633 200 C 596 250, 548 276, 573 318"/>
  <polygon class="arrow-red" points="573,318 564,307 577,306"/>
  <line class="line" x1="688" y1="356" x2="788" y2="356"/>
  <polygon class="arrow" points="788,356 776,350 776,362"/>

  <text class="red" x="292" y="456">Measure image pull + model load + CUDA init separately.</text>
</svg>
