<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">Host allocator tuning for GPU feeding</title>
  <desc id="desc">A technical diagram showing CPU data preparation, allocator behavior, pinned memory, host to device copy, and GPU compute goodput.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .bg { fill: #F3EFE7; }
      .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
      .soft { fill: #F5F1EA; stroke: #D8D1C7; stroke-width: 1.2; }
      .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
      .line { fill: none; stroke: #111111; stroke-width: 1.8; }
      .dash { fill: none; stroke: #6F6A63; stroke-width: 1.3; stroke-dasharray: 6 5; }
      .label { fill: #050505; font-size: 17px; font-weight: 700; }
      .small { fill: #6F6A63; font-size: 13px; }
      .red { fill: #D9392E; font-size: 13px; font-weight: 700; }
      .arrow { fill: #111111; }
      .arrow-red { fill: #D9392E; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="520"/>

  <rect class="box" x="62" y="96" width="180" height="84" rx="8"/>
  <text class="label" x="96" y="130">DataLoader</text>
  <text class="small" x="90" y="154">tokenize, decode, batch</text>

  <rect class="accent" x="316" y="70" width="220" height="120" rx="8"/>
  <text class="label" x="370" y="106">CPU allocator</text>
  <text class="small" x="354" y="132">jemalloc / tcmalloc</text>
  <text class="small" x="354" y="156">arenas, thread cache</text>

  <rect class="soft" x="598" y="96" width="196" height="84" rx="8"/>
  <text class="label" x="636" y="130">Pinned host RAM</text>
  <text class="small" x="642" y="154">page-locked buffers</text>

  <rect class="box" x="866" y="96" width="190" height="84" rx="8"/>
  <text class="label" x="912" y="130">GPU compute</text>
  <text class="small" x="910" y="154">kernel work, HBM</text>

  <line class="line" x1="242" y1="138" x2="316" y2="138"/>
  <polygon class="arrow" points="316,138 304,132 304,144"/>
  <line class="line" x1="536" y1="138" x2="598" y2="138"/>
  <polygon class="arrow" points="598,138 586,132 586,144"/>
  <line class="line" x1="794" y1="138" x2="866" y2="138"/>
  <polygon class="arrow" points="866,138 854,132 854,144"/>

  <rect class="soft" x="116" y="282" width="210" height="90" rx="8"/>
  <text class="label" x="152" y="316">Bad allocator path</text>
  <text class="small" x="146" y="340">global locks, page return</text>
  <text class="small" x="146" y="360">fragmentation, jitter</text>

  <rect class="soft" x="410" y="282" width="240" height="90" rx="8"/>
  <text class="label" x="456" y="316">Tuned allocator path</text>
  <text class="small" x="444" y="340">larger thread caches</text>
  <text class="small" x="444" y="360">background purge off path</text>

  <rect class="accent" x="742" y="282" width="224" height="90" rx="8"/>
  <text class="label" x="792" y="316">Goodput impact</text>
  <text class="small" x="780" y="340">fewer feeding bubbles</text>
  <text class="small" x="780" y="360">lower step-time variance</text>

  <path class="dash" d="M 426 190 C 388 234, 300 246, 220 282"/>
  <path class="line" d="M 536 190 C 560 232, 538 246, 530 282"/>
  <polygon class="arrow" points="530,282 525,269 541,274"/>
  <line class="line" x1="650" y1="327" x2="742" y2="327"/>
  <polygon class="arrow-red" points="742,327 730,321 730,333"/>

  <text class="red" x="150" y="432">Allocator tuning removes CPU-side pauses before H2D copy.</text>
</svg>
