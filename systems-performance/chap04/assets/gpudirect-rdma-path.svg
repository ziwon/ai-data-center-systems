<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">GPUDirect RDMA path versus host staged networking</title>
  <desc id="desc">A two-path diagram comparing host staged TCP copies with a direct GPUDirect RDMA transfer between GPU memories.</desc>
  <defs>
    <style>
      text { font-family: Arial, sans-serif; }
      .bg { fill: #F5F1EA; }
      .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
      .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
      .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
      .line { fill: none; stroke: #111111; stroke-width: 1.8; }
      .dash { fill: none; stroke: #6F6A63; stroke-width: 1.3; stroke-dasharray: 7 5; }
      .label { fill: #050505; font-size: 17px; font-weight: 700; }
      .small { fill: #6F6A63; font-size: 13px; }
      .red { fill: #D9392E; font-size: 13px; font-weight: 700; }
      .arrow { fill: #111111; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="560"/>

  <rect class="box" x="72" y="78" width="380" height="410" rx="8"/>
  <text class="label" x="96" y="116">Host staged fallback</text>
  <text class="small" x="96" y="140">More copies, kernel stack, higher CPU load.</text>
  <rect class="soft" x="120" y="190" width="130" height="64" rx="6"/>
  <text class="small" x="156" y="228">GPU A</text>
  <rect class="soft" x="290" y="190" width="130" height="64" rx="6"/>
  <text class="small" x="326" y="228">CPU RAM</text>
  <rect class="soft" x="290" y="300" width="130" height="64" rx="6"/>
  <text class="small" x="320" y="338">kernel</text>
  <rect class="soft" x="120" y="300" width="130" height="64" rx="6"/>
  <text class="small" x="156" y="338">GPU B</text>
  <path class="line" d="M 250 222 L 290 222 L 290 332"/>
  <polygon class="arrow" points="290,332 284,320 296,320"/>
  <path class="line" d="M 290 332 L 250 332"/>
  <polygon class="arrow" points="250,332 262,326 262,338"/>
  <text class="red" x="120" y="438">Symptoms: NET/Socket, CPU spike, low busbw</text>

  <rect class="box" x="568" y="78" width="380" height="410" rx="8"/>
  <text class="label" x="592" y="116">GPUDirect RDMA path</text>
  <text class="small" x="592" y="140">NIC reads and writes GPU memory directly.</text>
  <rect class="accent" x="616" y="208" width="130" height="64" rx="6"/>
  <text class="small" x="652" y="246">GPU A</text>
  <rect class="soft" x="790" y="208" width="130" height="64" rx="6"/>
  <text class="small" x="818" y="246">NIC / HCA</text>
  <rect class="soft" x="790" y="320" width="130" height="64" rx="6"/>
  <text class="small" x="814" y="358">IB / RoCE</text>
  <rect class="accent" x="616" y="320" width="130" height="64" rx="6"/>
  <text class="small" x="652" y="358">GPU B</text>
  <path class="line" d="M 746 240 L 790 240 L 790 352 L 746 352"/>
  <polygon class="arrow" points="746,352 758,346 758,358"/>

  <path class="dash" d="M 502 146 L 502 488"/>
  <text class="red" x="592" y="438">Verify: nvidia-peermem, /dev/infiniband, NET/IB</text>
</svg>
