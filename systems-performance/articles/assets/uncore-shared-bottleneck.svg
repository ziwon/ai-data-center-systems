<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Uncore shared bottleneck</title>
  <desc id="desc">A diagram showing CPU cores with private L1 and L2 caches sharing uncore resources such as LLC, memory controller, and DRAM path.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: #F5F1EA; stroke: #D8D1C7; stroke-width: 1.2; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .line { fill: none; stroke: #111111; stroke-width: 1.7; }
    .redline { fill: none; stroke: #D9392E; stroke-width: 2.2; }
    .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #050505; font-size: 16px; }
    .small { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6F6A63; font-size: 13px; }
    .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #050505; font-size: 14px; font-weight: 700; }
    .red { fill: #D9392E; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D9392E"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="560"/>

  <rect class="panel" x="74" y="70" width="426" height="388"/>
  <rect class="panel" x="620" y="70" width="426" height="388"/>

  <text class="label" x="104" y="110">Inside the cores</text>
  <text class="small" x="104" y="134">Private resources reduce interference,</text>
  <text class="small" x="104" y="154">but do not remove shared bottlenecks.</text>

  <g>
    <rect class="box" x="118" y="174" width="116" height="52"/>
    <rect class="soft" x="252" y="174" width="62" height="52"/>
    <rect class="soft" x="330" y="174" width="62" height="52"/>
    <text class="text" x="176" y="207" text-anchor="middle">Core</text>
    <text class="text" x="283" y="207" text-anchor="middle">L1</text>
    <text class="text" x="361" y="207" text-anchor="middle">L2</text>
  </g>
  <g>
    <rect class="box" x="118" y="250" width="116" height="52"/>
    <rect class="soft" x="252" y="250" width="62" height="52"/>
    <rect class="soft" x="330" y="250" width="62" height="52"/>
    <text class="text" x="176" y="283" text-anchor="middle">Core</text>
    <text class="text" x="283" y="283" text-anchor="middle">L1</text>
    <text class="text" x="361" y="283" text-anchor="middle">L2</text>
  </g>
  <g>
    <rect class="box" x="118" y="326" width="116" height="52"/>
    <rect class="soft" x="252" y="326" width="62" height="52"/>
    <rect class="soft" x="330" y="326" width="62" height="52"/>
    <text class="text" x="176" y="359" text-anchor="middle">Core</text>
    <text class="text" x="283" y="359" text-anchor="middle">L1</text>
    <text class="text" x="361" y="359" text-anchor="middle">L2</text>
  </g>

  <text class="label" x="650" y="110">Uncore</text>
  <text class="small" x="650" y="134">Shared resources outside the cores can saturate as node load rises.</text>

  <rect class="accent" x="682" y="176" width="154" height="182"/>
  <text class="text" x="759" y="252" text-anchor="middle">L3 / LLC</text>
  <text class="small" x="759" y="278" text-anchor="middle">shared cache</text>

  <rect class="box" x="872" y="176" width="126" height="70"/>
  <text class="text" x="935" y="205" text-anchor="middle">Memory</text>
  <text class="text" x="935" y="226" text-anchor="middle">controller</text>

  <rect class="box" x="872" y="288" width="126" height="70"/>
  <text class="text" x="935" y="329" text-anchor="middle">DRAM path</text>

  <path class="line" d="M392 200 C500 200, 574 224, 682 224" marker-end="url(#arrow)"/>
  <path class="line" d="M392 276 C500 276, 574 276, 682 276" marker-end="url(#arrow)"/>
  <path class="line" d="M392 352 C500 352, 574 328, 682 328" marker-end="url(#arrow)"/>
  <path class="redline" d="M836 236 C854 230, 858 220, 872 212" marker-end="url(#arrow-red)"/>
  <path class="redline" d="M836 300 C856 308, 858 318, 872 324" marker-end="url(#arrow-red)"/>

  <text class="small" x="658" y="414">As pod density rises, shared LLC and</text>
  <text class="small" x="658" y="438">memory-controller pressure can increase</text>
  <text class="small" x="658" y="462">CPU cost for the same work.</text>
  <text class="small" x="658" y="486">This is why node utilization and pod CPU can</text>
  <text class="small" x="658" y="510">move together even when load balancing is good.</text>

  <text class="small" x="90" y="520">Reconstructed from the presentation's uncore slides; not a verbatim slide crop.</text>
</svg>
