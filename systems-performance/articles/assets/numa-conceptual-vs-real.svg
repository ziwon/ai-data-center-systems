<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual shared bus versus NUMA memory layout</title>
  <desc id="desc">A simplified comparison showing why a single shared memory bus is not the useful mental model for large servers, and how CPU-local memory creates non-uniform access costs.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: #F5F1EA; stroke: #D8D1C7; stroke-width: 1.2; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .line { fill: none; stroke: #111111; stroke-width: 1.7; }
    .softline { fill: none; stroke: #6F6A63; stroke-width: 1.3; }
    .redline { fill: none; stroke: #D9392E; stroke-width: 2.2; }
    .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #050505; font-size: 16px; }
    .small { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6F6A63; font-size: 13px; }
    .label { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #050505; font-size: 14px; font-weight: 700; }
    .red { fill: #D9392E; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#D9392E"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="560"/>

  <rect class="panel" x="58" y="62" width="478" height="410"/>
  <rect class="panel" x="584" y="62" width="478" height="410"/>

  <text class="label" x="86" y="102">Conceptual model</text>
  <text class="small" x="86" y="126">Useful for teaching, misleading for large servers.</text>

  <text class="label" x="612" y="102">NUMA model</text>
  <text class="small" x="612" y="126">Memory is physically closer to some CPUs than others.</text>

  <rect class="soft" x="108" y="178" width="72" height="58"/>
  <rect class="soft" x="210" y="178" width="72" height="58"/>
  <rect class="soft" x="312" y="178" width="72" height="58"/>
  <rect class="soft" x="414" y="178" width="72" height="58"/>
  <text class="text" x="144" y="214" text-anchor="middle">CPU</text>
  <text class="text" x="246" y="214" text-anchor="middle">CPU</text>
  <text class="text" x="348" y="214" text-anchor="middle">CPU</text>
  <text class="text" x="450" y="214" text-anchor="middle">CPU</text>
  <path class="line" d="M144 236 L144 286 L450 286 L450 236"/>
  <path class="line" d="M246 236 L246 286"/>
  <path class="line" d="M348 236 L348 286"/>
  <text class="label" x="486" y="291">Bus</text>
  <rect class="box" x="136" y="326" width="324" height="62"/>
  <text class="text" x="298" y="363" text-anchor="middle">Memory</text>

  <rect class="box" x="636" y="168" width="150" height="116"/>
  <text class="label" x="666" y="198">NUMA 0</text>
  <rect class="soft" x="656" y="214" width="48" height="42"/>
  <rect class="soft" x="718" y="214" width="48" height="42"/>
  <text class="small" x="680" y="241" text-anchor="middle">CPU</text>
  <text class="small" x="742" y="241" text-anchor="middle">Mem</text>

  <rect class="box" x="858" y="168" width="150" height="116"/>
  <text class="label" x="888" y="198">NUMA 1</text>
  <rect class="soft" x="878" y="214" width="48" height="42"/>
  <rect class="soft" x="940" y="214" width="48" height="42"/>
  <text class="small" x="902" y="241" text-anchor="middle">CPU</text>
  <text class="small" x="964" y="241" text-anchor="middle">Mem</text>

  <rect class="box" x="636" y="336" width="150" height="88"/>
  <text class="label" x="666" y="366">NUMA 2</text>
  <rect class="soft" x="656" y="382" width="48" height="28"/>
  <rect class="soft" x="718" y="382" width="48" height="28"/>
  <text class="small" x="680" y="402" text-anchor="middle">CPU</text>
  <text class="small" x="742" y="402" text-anchor="middle">Mem</text>

  <path class="line" d="M704 235 L718 235" marker-end="url(#arrow)"/>
  <text class="small" x="646" y="312">local memory access</text>
  <path class="redline" d="M704 235 C760 152, 876 152, 940 235" marker-end="url(#arrow-red)"/>
  <text class="small" x="818" y="138"><tspan class="red">remote</tspan> memory access</text>
  <path class="softline" d="M786 226 L858 226"/>
  <path class="softline" d="M712 284 L712 336"/>
  <path class="softline" d="M934 284 L934 336"/>

  <text class="small" x="86" y="516">Reconstructed from Bryan Boreham's KubeCon + CloudNativeCon Japan 2025 slides; not a verbatim slide crop.</text>
</svg>
