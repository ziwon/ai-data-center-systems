<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540">
<rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="960" height="540" fill="#f8fafc"/>
<text x="60" y="40" font-size="22" font-family="Inter, Arial, sans-serif" font-weight="700" fill="#0f172a">Same bits, opposite speed: the kernel decides</text>
<text x="60" y="64" font-size="13" font-family="Inter, Arial, sans-serif" fill="#475569">Qwen2.5-3B on RTX 5080 (Blackwell) - decode speedup vs BF16, batch 1, 32 tokens. >1 = faster.</text>
<line x1="90" y1="440.0" x2="900" y2="440.0" stroke="#e5e7eb"/>
<text x="80" y="444.0" text-anchor="end" font-size="11" font-family="Inter, Arial, sans-serif" fill="#475569">0.00x</text>
<line x1="90" y1="372.0" x2="900" y2="372.0" stroke="#e5e7eb"/>
<text x="80" y="376.0" text-anchor="end" font-size="11" font-family="Inter, Arial, sans-serif" fill="#475569">0.50x</text>
<line x1="90" y1="304.0" x2="900" y2="304.0" stroke="#e5e7eb"/>
<text x="80" y="308.0" text-anchor="end" font-size="11" font-family="Inter, Arial, sans-serif" fill="#475569">1.00x</text>
<line x1="90" y1="236.0" x2="900" y2="236.0" stroke="#e5e7eb"/>
<text x="80" y="240.0" text-anchor="end" font-size="11" font-family="Inter, Arial, sans-serif" fill="#475569">1.50x</text>
<line x1="90" y1="168.0" x2="900" y2="168.0" stroke="#e5e7eb"/>
<text x="80" y="172.0" text-anchor="end" font-size="11" font-family="Inter, Arial, sans-serif" fill="#475569">2.00x</text>
<line x1="90" y1="100.0" x2="900" y2="100.0" stroke="#e5e7eb"/>
<text x="80" y="104.0" text-anchor="end" font-size="11" font-family="Inter, Arial, sans-serif" fill="#475569">2.50x</text>
<rect x="157.5" y="412.8" width="135.0" height="27.2" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5" rx="3"/>
<text x="225.0" y="402.8" text-anchor="middle" font-size="14" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#0f172a">0.20x</text>
<text x="225.0" y="460.0" text-anchor="middle" font-size="12" font-weight="600" font-family="Inter, Arial, sans-serif" fill="#0f172a">bnb INT8</text>
<text x="225.0" y="478.0" text-anchor="middle" font-size="11" font-family="Inter, Arial, sans-serif" fill="#475569">HF generate</text>
<rect x="427.5" y="361.1" width="135.0" height="78.9" fill="#dc2626" stroke="#7f1d1d" stroke-width="1.5" rx="3"/>
<text x="495.0" y="351.1" text-anchor="middle" font-size="14" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#0f172a">0.58x</text>
<text x="495.0" y="460.0" text-anchor="middle" font-size="12" font-weight="600" font-family="Inter, Arial, sans-serif" fill="#0f172a">bnb NF4 (4-bit)</text>
<text x="495.0" y="478.0" text-anchor="middle" font-size="11" font-family="Inter, Arial, sans-serif" fill="#475569">HF generate</text>
<rect x="697.5" y="149.0" width="135.0" height="291.0" fill="#16a34a" stroke="#14532d" stroke-width="1.5" rx="3"/>
<text x="765.0" y="139.0" text-anchor="middle" font-size="14" font-weight="700" font-family="Inter, Arial, sans-serif" fill="#0f172a">2.14x</text>
<text x="765.0" y="460.0" text-anchor="middle" font-size="12" font-weight="600" font-family="Inter, Arial, sans-serif" fill="#0f172a">AWQ-INT4 (4-bit)</text>
<text x="765.0" y="478.0" text-anchor="middle" font-size="11" font-family="Inter, Arial, sans-serif" fill="#475569">vLLM Marlin</text>
<line x1="90" y1="304.0" x2="900" y2="304.0" stroke="#d97706" stroke-width="1.6" stroke-dasharray="7 4"/>
<text x="900" y="298.0" text-anchor="end" font-size="11" font-family="Inter, Arial, sans-serif" fill="#d97706">BF16 baseline = 1.00x</text>
<line x1="90" y1="100" x2="90" y2="440" stroke="#0f172a" stroke-width="1.4"/>
<line x1="90" y1="440" x2="900" y2="440" stroke="#0f172a" stroke-width="1.4"/>
<text transform="translate(28 270) rotate(-90)" text-anchor="middle" font-size="13" font-family="Inter, Arial, sans-serif" fill="#0f172a">Speedup vs BF16 (x)</text>
<text x="60" y="500" font-size="12" font-family="Inter, Arial, sans-serif" fill="#475569">Both 4-bit. bitsandbytes is a memory path (dequant overhead); AWQ+Marlin is a fused low-bit GEMM. Speedups are within each engine.</text>
</svg>