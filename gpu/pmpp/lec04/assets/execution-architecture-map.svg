<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">CUDA execution architecture map</title>
  <desc id="desc">CUDA grids are decomposed into independent thread blocks. Blocks are assigned to streaming multiprocessors, where block-local collaboration and warp-level scheduling enable SIMD or SIMT issue and latency hiding.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: none; stroke: #111111; stroke-width: 1.5; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.5; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.4; }
    .accent-box { fill: #F3EFE7; stroke: #D9392E; stroke-width: 2; }
    .line { fill: none; stroke: #111111; stroke-width: 1.8; marker-end: url(#arrow); }
    .soft-line { fill: none; stroke: #6F6A63; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#soft-arrow); }
    .accent-line { fill: none; stroke: #D9392E; stroke-width: 2.2; marker-end: url(#accent-arrow); }
    .label { fill: #050505; font-family: Inter, Arial, sans-serif; font-size: 18px; font-weight: 700; }
    .mid { fill: #050505; font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 600; }
    .small { fill: #6F6A63; font-family: Inter, Arial, sans-serif; font-size: 13px; }
    .mono { fill: #050505; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    .accent { fill: #D9392E; font-family: Inter, Arial, sans-serif; font-size: 14px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="soft-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6F6A63"/>
    </marker>
    <marker id="accent-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9392E"/>
    </marker>
  </defs>

  <rect class="bg" width="1100" height="430"/>

  <rect class="panel" x="34" y="44" width="214" height="306" rx="6"/>
  <text class="label" x="62" y="80">CUDA grid</text>
  <text class="small" x="62" y="102">Many independent blocks</text>
  <rect class="soft" x="64" y="134" width="62" height="48" rx="4"/>
  <rect class="soft" x="146" y="134" width="62" height="48" rx="4"/>
  <rect class="soft" x="64" y="202" width="62" height="48" rx="4"/>
  <rect class="soft" x="146" y="202" width="62" height="48" rx="4"/>
  <text class="mono" x="82" y="163">B0</text>
  <text class="mono" x="164" y="163">B1</text>
  <text class="mono" x="82" y="231">B2</text>
  <text class="mono" x="164" y="231">B3</text>
  <rect class="accent-box" x="78" y="286" width="116" height="38" rx="5"/>
  <text class="accent" x="96" y="310">waiting blocks</text>

  <path class="line" d="M 248 178 C 276 178 286 178 314 178"/>
  <path class="soft-line" d="M 194 305 C 260 324 292 310 334 284"/>

  <rect class="panel" x="314" y="44" width="308" height="306" rx="6"/>
  <text class="label" x="342" y="80">SM 0</text>
  <text class="small" x="342" y="102">Thread blocks become resident</text>
  <rect class="box" x="344" y="130" width="104" height="54" rx="5"/>
  <rect class="box" x="472" y="130" width="104" height="54" rx="5"/>
  <text class="mid" x="369" y="153">block</text>
  <text class="small" x="368" y="171">all threads</text>
  <text class="mid" x="497" y="153">block</text>
  <text class="small" x="496" y="171">all threads</text>
  <rect class="accent-box" x="344" y="222" width="232" height="74" rx="6"/>
  <text class="mid" x="368" y="252">block-local collaboration</text>
  <text class="small" x="368" y="274">shared memory + __syncthreads()</text>

  <rect class="panel" x="668" y="44" width="180" height="306" rx="6"/>
  <text class="label" x="696" y="80">Warp layer</text>
  <text class="small" x="696" y="102">Scheduling unit</text>
  <rect class="box" x="700" y="132" width="116" height="42" rx="5"/>
  <rect class="box" x="700" y="190" width="116" height="42" rx="5"/>
  <rect class="box" x="700" y="248" width="116" height="42" rx="5"/>
  <text class="mid" x="723" y="158">warp 0</text>
  <text class="mid" x="723" y="216">warp 1</text>
  <text class="mid" x="723" y="274">warp 2</text>
  <text class="small" x="716" y="318">typically 32 threads</text>

  <path class="line" d="M 576 157 C 620 157 644 154 700 154"/>
  <path class="line" d="M 576 259 C 620 245 646 221 700 211"/>

  <rect class="panel" x="898" y="44" width="168" height="306" rx="6"/>
  <text class="label" x="926" y="80">Issue path</text>
  <text class="small" x="926" y="102">Ready warp chosen</text>
  <rect class="box" x="928" y="132" width="108" height="46" rx="5"/>
  <text class="mid" x="948" y="159">scheduler</text>
  <rect class="box" x="928" y="206" width="108" height="46" rx="5"/>
  <text class="mid" x="945" y="233">SIMT issue</text>
  <rect class="accent-box" x="918" y="280" width="128" height="42" rx="5"/>
  <text class="accent" x="939" y="306">hide latency</text>

  <path class="line" d="M 816 154 C 856 154 878 154 928 154"/>
  <path class="line" d="M 982 178 L 982 206"/>
  <path class="accent-line" d="M 982 252 L 982 280"/>
  <path class="soft-line" d="M 918 302 C 854 344 754 342 718 294"/>

  <rect class="panel" x="314" y="374" width="752" height="34" rx="6"/>
  <text class="mono" x="344" y="396">block = SM allocation and collaboration scope; warp = instruction issue and latency-hiding scope</text>
</svg>
