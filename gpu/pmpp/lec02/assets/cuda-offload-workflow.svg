<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">CUDA host and device offload workflow</title>
  <desc id="desc">Host memory, device global memory, host-to-device copy, kernel execution, device-to-host copy, and cleanup in a CUDA vector addition workflow.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: none; stroke: #111111; stroke-width: 1.5; }
    .soft { fill: none; stroke: #D8D1C7; stroke-width: 1.2; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .muted-box { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent-box { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .line { fill: none; stroke: #111111; stroke-width: 1.8; marker-end: url(#arrow); }
    .accent-line { fill: none; stroke: #D9392E; stroke-width: 2.2; marker-end: url(#accent-arrow); }
    .dash { fill: none; stroke: #6F6A63; stroke-width: 1.3; stroke-dasharray: 5 5; }
    .label { fill: #050505; font: 600 18px Inter, Arial, sans-serif; }
    .small { fill: #6F6A63; font: 13px Inter, Arial, sans-serif; }
    .mono { fill: #050505; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .step { fill: #D9392E; font: 700 15px Inter, Arial, sans-serif; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="accent-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D9392E"/>
    </marker>
  </defs>

  <rect class="bg" width="980" height="420"/>

  <rect class="panel" x="42" y="58" width="260" height="290" rx="6"/>
  <rect class="panel" x="678" y="58" width="260" height="290" rx="6"/>

  <text class="label" x="70" y="94">Host</text>
  <text class="small" x="70" y="116">CPU address space</text>
  <text class="label" x="706" y="94">Device</text>
  <text class="small" x="706" y="116">GPU global memory</text>

  <rect class="muted-box" x="74" y="150" width="196" height="58" rx="4"/>
  <text class="mono" x="96" y="174">x, y input arrays</text>
  <text class="small" x="96" y="194">allocated by malloc</text>

  <rect class="muted-box" x="74" y="250" width="196" height="58" rx="4"/>
  <text class="mono" x="96" y="274">z output array</text>
  <text class="small" x="96" y="294">visible to CPU code</text>

  <rect class="box" x="710" y="140" width="196" height="78" rx="4"/>
  <text class="mono" x="732" y="166">x_d, y_d</text>
  <text class="small" x="732" y="187">device input buffers</text>
  <text class="small" x="732" y="205">from cudaMalloc</text>

  <rect class="box" x="710" y="250" width="196" height="58" rx="4"/>
  <text class="mono" x="732" y="274">z_d</text>
  <text class="small" x="732" y="294">device result buffer</text>

  <rect class="accent-box" x="394" y="144" width="190" height="82" rx="4"/>
  <text class="label" x="426" y="174">Kernel</text>
  <text class="mono" x="426" y="197">z[i] = x[i] + y[i]</text>
  <text class="small" x="426" y="216">one thread per element</text>

  <path class="accent-line" d="M 270 179 C 350 179 350 179 710 179"/>
  <text class="step" x="325" y="160">1</text>
  <text class="small" x="348" y="160">cudaMemcpyHostToDevice</text>

  <path class="line" d="M 808 218 L 808 250"/>
  <text class="step" x="828" y="238">2</text>
  <text class="small" x="848" y="238">kernel writes</text>

  <path class="accent-line" d="M 710 279 C 582 279 420 279 270 279"/>
  <text class="step" x="488" y="306">3</text>
  <text class="small" x="512" y="306">cudaMemcpyDeviceToHost</text>

  <path class="dash" d="M 302 332 C 416 376 560 376 678 332"/>
  <text class="small" x="390" y="382">allocate once, run many kernels when possible, copy back late</text>

  <rect class="muted-box" x="384" y="58" width="210" height="50" rx="4"/>
  <text class="mono" x="412" y="80">cudaMalloc / cudaFree</text>
  <text class="small" x="412" y="99">lifetime around device buffers</text>

  <path class="soft" d="M 594 83 L 678 83"/>
  <path class="soft" d="M 302 83 L 384 83"/>
</svg>
