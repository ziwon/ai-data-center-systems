<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">Host and device memory organization</title>
  <desc id="desc">A CUDA system has CPU host memory and GPU device global memory connected through an interconnect such as PCIe or NVLink.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.5; }
    .primary { fill: #F5F1EA; stroke: #111111; stroke-width: 1.8; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .line { fill: none; stroke: #111111; stroke-width: 1.5; marker-end: url(#arrow); }
    .bi { fill: none; stroke: #111111; stroke-width: 1.5; marker-start: url(#arrow-start); marker-end: url(#arrow); }
    .soft { fill: none; stroke: #D8D1C7; stroke-width: 1.4; }
    .label { fill: #050505; font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 600; }
    .small { fill: #6F6A63; font-family: Inter, Arial, sans-serif; font-size: 13px; font-weight: 400; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect class="bg" width="1080" height="300" rx="8"/>

  <rect class="primary" x="52" y="112" width="128" height="86" rx="4"/>
  <text class="label" x="94" y="146">Host</text>
  <text class="small" x="96" y="169">CPU</text>

  <rect class="box" x="265" y="54" width="230" height="78" rx="4"/>
  <text class="label" x="324" y="86">Host memory</text>
  <text class="small" x="352" y="109">DRAM</text>

  <rect class="accent" x="258" y="178" width="250" height="78" rx="4"/>
  <text class="label" x="331" y="210">Interconnect</text>
  <text class="small" x="333" y="233">PCIe or NVLink</text>

  <rect class="primary" x="620" y="112" width="140" height="86" rx="4"/>
  <text class="label" x="660" y="146">Device</text>
  <text class="small" x="674" y="169">GPU</text>

  <rect class="box" x="835" y="119" width="210" height="72" rx="4"/>
  <text class="label" x="873" y="148">Device global</text>
  <text class="small" x="905" y="171">memory</text>

  <path class="soft" d="M 180 133 C 218 80 226 88 265 92"/>
  <path class="line" d="M 180 176 C 214 214 226 216 258 217"/>
  <path class="bi" d="M 508 217 L 620 155"/>
  <path class="line" d="M 760 155 L 835 155"/>
</svg>
