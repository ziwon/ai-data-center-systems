<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="585.00" viewBox="0 0 1140 585" role="img" aria-labelledby="title desc"><title id="title">Channels-last의 주소 간격</title><desc id="desc">동일한 논리적 shape에서 채널 stride가 바뀌면 가상의 warp가 접근하는 32byte 영역 수가 달라진다.</desc><rect width="1140" height="585" fill="#ffffff"/><g font-family="Malgun Gothic, Noto Sans CJK KR, sans-serif"><text x="32" y="44" font-size="26" fill="#0f172a" font-weight="700">Shape은 같아도 warp가 요청하는 주소는 달라진다</text><text x="32" y="77" font-size="17" fill="#334155" font-weight="400">BF16 · shape (2, 64, 32, 32) · 고정된 (n,h,w)에서 lane i가 channel i를 읽는 예</text><text x="32" y="102" font-size="16" fill="#64748b" font-weight="400">Base는 32byte 정렬로 가정. 실제 cuDNN lane 배치를 측정한 그림은 아니다.</text><rect x="24" y="130" width="1092" height="205" rx="10" fill="#fff7ed" stroke="#c2410c"/><text x="48" y="164" font-size="22" fill="#c2410c" font-weight="700">Contiguous NCHW</text><text x="48" y="195" font-size="18" fill="#334155" font-weight="400">stride = (65536, 1024, 32, 1)</text><text x="650" y="166" font-size="19" fill="#c2410c" font-weight="700">채널 간격 2,048 bytes</text><text x="650" y="195" font-size="17" fill="#334155" font-weight="400">32개 lane → 서로 다른 32byte 영역 32개</text><rect x="52" y="223" width="96" height="50" rx="5" fill="#ffffff" stroke="#fdba74"/><text x="62" y="253" font-size="16" fill="#334155" font-weight="400">lane 0</text><text x="55" y="300" font-size="15" fill="#c2410c" font-weight="400">0</text><rect x="173" y="223" width="96" height="50" rx="5" fill="#ffffff" stroke="#fdba74"/><text x="183" y="253" font-size="16" fill="#334155" font-weight="400">lane 1</text><text x="176" y="300" font-size="15" fill="#c2410c" font-weight="400">2048</text><rect x="294" y="223" width="96" height="50" rx="5" fill="#ffffff" stroke="#fdba74"/><text x="304" y="253" font-size="16" fill="#334155" font-weight="400">lane 2</text><text x="297" y="300" font-size="15" fill="#c2410c" font-weight="400">4096</text><rect x="415" y="223" width="96" height="50" rx="5" fill="#ffffff" stroke="#fdba74"/><text x="425" y="253" font-size="16" fill="#334155" font-weight="400">lane 3</text><text x="418" y="300" font-size="15" fill="#c2410c" font-weight="400">6144</text><rect x="536" y="223" width="96" height="50" rx="5" fill="#ffffff" stroke="#fdba74"/><text x="546" y="253" font-size="16" fill="#334155" font-weight="400">lane 4</text><text x="539" y="300" font-size="15" fill="#c2410c" font-weight="400">8192</text><rect x="657" y="223" width="96" height="50" rx="5" fill="#ffffff" stroke="#fdba74"/><text x="667" y="253" font-size="16" fill="#334155" font-weight="400">lane 5</text><text x="660" y="300" font-size="15" fill="#c2410c" font-weight="400">10240</text><rect x="778" y="223" width="96" height="50" rx="5" fill="#ffffff" stroke="#fdba74"/><text x="788" y="253" font-size="16" fill="#334155" font-weight="400">lane 6</text><text x="781" y="300" font-size="15" fill="#c2410c" font-weight="400">12288</text><rect x="899" y="223" width="96" height="50" rx="5" fill="#ffffff" stroke="#fdba74"/><text x="909" y="253" font-size="16" fill="#334155" font-weight="400">… 31</text><text x="902" y="300" font-size="15" fill="#c2410c" font-weight="400">63488</text><text x="48" y="323" font-size="15" fill="#64748b" font-weight="400">위 숫자는 base로부터의 byte offset. 박스 사이 간격은 실제 주소 거리의 축척이 아니다.</text><rect x="24" y="355" width="1092" height="205" rx="10" fill="#eff6ff" stroke="#1d4ed8"/><text x="48" y="389" font-size="22" fill="#1d4ed8" font-weight="700">Channels-last</text><text x="48" y="420" font-size="18" fill="#334155" font-weight="400">stride = (65536, 1, 2048, 64)</text><text x="650" y="391" font-size="19" fill="#1d4ed8" font-weight="700">채널 간격 2 bytes</text><text x="650" y="420" font-size="17" fill="#334155" font-weight="400">32개 lane → 연속된 32byte 영역 2개</text><rect x="52" y="443" width="480" height="66" rx="5" fill="#ffffff" stroke="#60a5fa"/><rect x="60" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="64" y="473" font-size="12" fill="#173469" font-weight="400">0</text><rect x="89" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="93" y="473" font-size="12" fill="#173469" font-weight="400">1</text><rect x="118" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="122" y="473" font-size="12" fill="#173469" font-weight="400">2</text><rect x="147" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="151" y="473" font-size="12" fill="#173469" font-weight="400">3</text><rect x="176" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="180" y="473" font-size="12" fill="#173469" font-weight="400">4</text><rect x="205" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="209" y="473" font-size="12" fill="#173469" font-weight="400">5</text><rect x="234" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="238" y="473" font-size="12" fill="#173469" font-weight="400">6</text><rect x="263" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="267" y="473" font-size="12" fill="#173469" font-weight="400">7</text><rect x="292" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="296" y="473" font-size="12" fill="#173469" font-weight="400">8</text><rect x="321" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="325" y="473" font-size="12" fill="#173469" font-weight="400">9</text><rect x="350" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="354" y="473" font-size="12" fill="#173469" font-weight="400">10</text><rect x="379" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="383" y="473" font-size="12" fill="#173469" font-weight="400">11</text><rect x="408" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="412" y="473" font-size="12" fill="#173469" font-weight="400">12</text><rect x="437" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="441" y="473" font-size="12" fill="#173469" font-weight="400">13</text><rect x="466" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="470" y="473" font-size="12" fill="#173469" font-weight="400">14</text><rect x="495" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="499" y="473" font-size="12" fill="#173469" font-weight="400">15</text><text x="64" y="501" font-size="14" fill="#1d4ed8" font-weight="400">lane 0–15 / offset 0–31 bytes</text><rect x="562" y="443" width="480" height="66" rx="5" fill="#ffffff" stroke="#60a5fa"/><rect x="570" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="574" y="473" font-size="12" fill="#173469" font-weight="400">16</text><rect x="599" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="603" y="473" font-size="12" fill="#173469" font-weight="400">17</text><rect x="628" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="632" y="473" font-size="12" fill="#173469" font-weight="400">18</text><rect x="657" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="661" y="473" font-size="12" fill="#173469" font-weight="400">19</text><rect x="686" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="690" y="473" font-size="12" fill="#173469" font-weight="400">20</text><rect x="715" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="719" y="473" font-size="12" fill="#173469" font-weight="400">21</text><rect x="744" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="748" y="473" font-size="12" fill="#173469" font-weight="400">22</text><rect x="773" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="777" y="473" font-size="12" fill="#173469" font-weight="400">23</text><rect x="802" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="806" y="473" font-size="12" fill="#173469" font-weight="400">24</text><rect x="831" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="835" y="473" font-size="12" fill="#173469" font-weight="400">25</text><rect x="860" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="864" y="473" font-size="12" fill="#173469" font-weight="400">26</text><rect x="889" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="893" y="473" font-size="12" fill="#173469" font-weight="400">27</text><rect x="918" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="922" y="473" font-size="12" fill="#173469" font-weight="400">28</text><rect x="947" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="951" y="473" font-size="12" fill="#173469" font-weight="400">29</text><rect x="976" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="980" y="473" font-size="12" fill="#173469" font-weight="400">30</text><rect x="1005" y="453" width="26" height="29" rx="2" fill="#dbeafe" stroke="#93c5fd"/><text x="1009" y="473" font-size="12" fill="#173469" font-weight="400">31</text><text x="574" y="501" font-size="14" fill="#1d4ed8" font-weight="400">lane 16–31 / offset 32–63 bytes</text><text x="48" y="545" font-size="15" fill="#64748b" font-weight="400">각 작은 칸은 한 lane의 BF16 원소 2bytes. 실제 트래픽은 캐시·벡터화·타일 배치에도 좌우된다.</text></g></svg>
