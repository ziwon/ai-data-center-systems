<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">GPU 입력 공급에서 로컬 경로와 소켓 간 경로</title>
  <desc id="desc">가상의 이중 소켓 서버. NUMA 0에는 CPU cores 0–31, memory 0, GPU 0–3, NIC 0이 있고 NUMA 1에는 CPU cores 32–63, memory 1, GPU 4–7, NIC 1이 있다. 각 CPU의 root complex 아래 PCIe switch에 GPU와 NIC가 연결된다. NUMA 1의 입력을 GPU 0–3으로 공급하면 빨간색으로 표시한 소켓 간 경로가 추가된다. 실제 서버의 연결 구조와 P2P 지원을 별도로 확인해야 한다.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: none; stroke: #D8D1C7; stroke-width: 1.4; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    text { font-family: Arial, "Noto Sans CJK KR", "Noto Sans KR", sans-serif; }
    .label { fill: #050505; font-size: 21px; font-weight: 700; }
    .text { fill: #050505; font-size: 18px; font-weight: 600; text-anchor: middle; }
    .small { fill: #6F6A63; font-size: 15px; }
    .center { text-anchor: middle; }
    .accent-text { fill: #D9392E; font-size: 16px; text-anchor: middle; }
    .link { fill: none; stroke: #111111; stroke-width: 1.5; }
    .path { fill: none; stroke: #111111; stroke-width: 1.8; marker-end: url(#arrow); }
    .remote { fill: none; stroke: #D9392E; stroke-width: 2.4; marker-end: url(#arrow-red); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#111111"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D9392E"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="540"/>
  <rect class="panel" x="40" y="28" width="520" height="444"/>
  <rect class="panel" x="640" y="28" width="520" height="444"/>

  <text class="label" x="64" y="62">NUMA 0</text>
  <text class="small" x="64" y="86">CPU cores 0–31</text>
  <text class="label" x="664" y="62">NUMA 1</text>
  <text class="small" x="664" y="86">CPU cores 32–63</text>

  <!-- CPU and memory links. The red segment is the extra socket crossing. -->
  <path class="path" d="M198 152 H220"/>
  <path class="path" d="M1002 152 H980"/>
  <path class="remote" d="M810 152 H390"/>
  <text class="accent-text" x="600" y="126">추가되는 소켓 간 경로</text>
  <text class="small center" x="600" y="183">remote input → GPU 0–3</text>

  <rect class="box" x="68" y="122" width="130" height="60"/>
  <text class="text" x="133" y="147">Memory 0</text>
  <text class="small center" x="133" y="169">local input</text>
  <rect class="box" x="220" y="122" width="170" height="60"/>
  <text class="text" x="305" y="147">CPU 0</text>
  <text class="small center" x="305" y="169">root complex</text>

  <rect class="box" x="810" y="122" width="170" height="60"/>
  <text class="text" x="895" y="147">CPU 1</text>
  <text class="small center" x="895" y="169">root complex</text>
  <rect class="box" x="1002" y="122" width="130" height="60"/>
  <text class="text" x="1067" y="147">Memory 1</text>
  <text class="small center" x="1067" y="169">remote input</text>

  <path class="path" d="M305 182 V250"/>
  <path class="link" d="M895 182 V250"/>
  <text class="small" x="320" y="221">PCIe</text>
  <text class="small" x="910" y="221">PCIe</text>

  <rect class="box" x="205" y="250" width="200" height="58"/>
  <text class="text" x="305" y="286">PCIe switch</text>
  <rect class="box" x="795" y="250" width="200" height="58"/>
  <text class="text" x="895" y="286">PCIe switch</text>

  <!-- GPU and NIC share a switch only in this illustrative topology. -->
  <path class="path" d="M305 308 V346 H160 V386"/>
  <path class="link" d="M305 346 H435 V386"/>
  <path class="link" d="M895 308 V346 H760 V386"/>
  <path class="link" d="M895 346 H1035 V386"/>

  <rect class="box" x="70" y="386" width="180" height="60"/>
  <text class="text" x="160" y="412">GPU 0–3</text>
  <text class="small center" x="160" y="434">입력을 받을 GPU</text>
  <rect class="box" x="355" y="386" width="160" height="60"/>
  <text class="text" x="435" y="422">NIC 0</text>

  <rect class="box" x="670" y="386" width="180" height="60"/>
  <text class="text" x="760" y="422">GPU 4–7</text>
  <rect class="box" x="955" y="386" width="160" height="60"/>
  <text class="text" x="1035" y="422">NIC 1</text>

  <path class="remote" d="M64 507 H104"/>
  <text class="small" x="118" y="512">소켓 간 이동 예시</text>
  <text class="small" x="400" y="512">연결 구조를 단순화한 그림 · 대역폭이나 P2P 지원을 보장하지 않음</text>
</svg>
