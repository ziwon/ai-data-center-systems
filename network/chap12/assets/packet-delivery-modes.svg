<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">UEC packet delivery modes</title>
  <desc id="desc">UEC packet delivery modes separated by reliability and ordering semantics.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: none; stroke: #D8D1C7; stroke-width: 1.2; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #050505; }
    .small { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #6F6A63; }
    .axis { fill: none; stroke: #111111; stroke-width: 1.3; }
  </style>
  <rect class="bg" width="1120" height="560"/>
  <rect class="panel" x="42" y="42" width="1036" height="458" rx="8"/>
  <g transform="translate(150 92)">
    <path class="axis" d="M0 330 H820"/>
    <path class="axis" d="M410 0 V380"/>
    <text class="label" x="205" y="365" text-anchor="middle">Ordered</text>
    <text class="label" x="615" y="365" text-anchor="middle">Unordered</text>
    <text class="label" x="-20" y="95" text-anchor="end">Reliable</text>
    <text class="label" x="-20" y="265" text-anchor="end">Unreliable</text>

    <rect class="accent" x="90" y="54" width="230" height="112" rx="6"/>
    <text class="label" x="205" y="94" text-anchor="middle">ROD</text>
    <text class="small" x="205" y="120" text-anchor="middle">reliable ordered delivery</text>
    <text class="small" x="205" y="142" text-anchor="middle">higher reordering cost</text>

    <rect class="accent" x="500" y="54" width="230" height="112" rx="6"/>
    <text class="label" x="615" y="94" text-anchor="middle">RUD / RUDI</text>
    <text class="small" x="615" y="120" text-anchor="middle">reliable unordered delivery</text>
    <text class="small" x="615" y="142" text-anchor="middle">lower latency, direct placement</text>

    <rect class="soft" x="500" y="224" width="230" height="112" rx="6"/>
    <text class="label" x="615" y="264" text-anchor="middle">UUD</text>
    <text class="small" x="615" y="290" text-anchor="middle">unreliable unordered delivery</text>
    <text class="small" x="615" y="312" text-anchor="middle">telemetry, logs, fire-and-forget</text>
  </g>
</svg>
