<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">UEC congestion and reliability mechanisms</title>
  <desc id="desc">UEC congestion and reliability mechanisms across end-to-end, fabric-assisted, and link-level scopes.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: none; stroke: #D8D1C7; stroke-width: 1.2; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .line { fill: none; stroke: #111111; stroke-width: 1.5; }
    .accent-line { fill: none; stroke: #D9392E; stroke-width: 2.2; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #050505; }
    .small { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #6F6A63; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D9392E"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="620"/>
  <rect class="panel" x="42" y="40" width="1036" height="520" rx="8"/>
  <g transform="translate(90 92)">
    <rect class="box" x="0" y="160" width="150" height="86" rx="6"/>
    <text class="label" x="75" y="194" text-anchor="middle">Sender NIC</text>
    <text class="small" x="75" y="218" text-anchor="middle">window / credits</text>
    <rect class="soft" x="300" y="160" width="150" height="86" rx="6"/>
    <text class="label" x="375" y="194" text-anchor="middle">UEC switch</text>
    <text class="small" x="375" y="218" text-anchor="middle">CBFC, LLR, trim</text>
    <rect class="soft" x="570" y="160" width="150" height="86" rx="6"/>
    <text class="label" x="645" y="194" text-anchor="middle">UEC switch</text>
    <text class="small" x="645" y="218" text-anchor="middle">segment control</text>
    <rect class="box" x="870" y="160" width="150" height="86" rx="6"/>
    <text class="label" x="945" y="194" text-anchor="middle">Receiver NIC</text>
    <text class="small" x="945" y="218" text-anchor="middle">ACK / credit</text>

    <path class="line" d="M150 203 H300" marker-end="url(#arrow)"/>
    <path class="line" d="M450 203 H570" marker-end="url(#arrow)"/>
    <path class="line" d="M720 203 H870" marker-end="url(#arrow)"/>
    <path class="accent-line" d="M870 235 C650 335 320 335 150 235" marker-end="url(#arrowAccent)"/>
    <text class="small" x="510" y="342" text-anchor="middle">NSCC feedback or RCCC credits return end to end</text>

    <rect class="accent" x="60" y="0" width="230" height="90" rx="6"/>
    <text class="label" x="175" y="34" text-anchor="middle">NSCC</text>
    <text class="small" x="175" y="59" text-anchor="middle">sender congestion window</text>
    <rect class="accent" x="395" y="0" width="230" height="90" rx="6"/>
    <text class="label" x="510" y="34" text-anchor="middle">RCCC</text>
    <text class="small" x="510" y="59" text-anchor="middle">receiver-managed credits</text>
    <rect class="box" x="730" y="0" width="230" height="90" rx="6"/>
    <text class="label" x="845" y="34" text-anchor="middle">CBFC / LLR</text>
    <text class="small" x="845" y="59" text-anchor="middle">link credits and local retry</text>

    <rect class="accent" x="300" y="405" width="420" height="84" rx="6"/>
    <text class="label" x="510" y="438" text-anchor="middle">Packet trimming</text>
    <text class="small" x="510" y="463" text-anchor="middle">During severe congestion, preserve context and trigger fast retransmission.</text>
  </g>
</svg>
