<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="700" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">UEC protocol stack</title>
  <desc id="desc">UEC protocol stack from AI applications and Libfabric through SES, PDS, congestion management, IP, Ethernet link, and PHY.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: none; stroke: #D8D1C7; stroke-width: 1.2; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #050505; }
    .small { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #6F6A63; }
  </style>
  <rect class="bg" width="1120" height="700"/>
  <rect class="panel" x="42" y="40" width="1036" height="600" rx="8"/>
  <g transform="translate(260 76)">
    <rect class="soft" x="0" y="0" width="600" height="58" rx="6"/>
    <text class="label" x="300" y="25" text-anchor="middle">Applications</text>
    <text class="small" x="300" y="44" text-anchor="middle">PyTorch, TensorFlow, HPC applications</text>
    <rect class="soft" x="0" y="74" width="600" height="58" rx="6"/>
    <text class="label" x="300" y="99" text-anchor="middle">Software APIs</text>
    <text class="small" x="300" y="118" text-anchor="middle">MPI, NCCL, RCCL, SHMEM, Libfabric</text>
    <rect class="accent" x="0" y="148" width="600" height="58" rx="6"/>
    <text class="label" x="300" y="173" text-anchor="middle">SES - Semantic Sublayer</text>
    <text class="small" x="300" y="192" text-anchor="middle">JobID, PIDonFEP, Resource Index, message semantics</text>
    <rect class="accent" x="0" y="222" width="600" height="58" rx="6"/>
    <text class="label" x="300" y="247" text-anchor="middle">PDS / PDC - Packet Delivery</text>
    <text class="small" x="300" y="266" text-anchor="middle">ROD, RUD, RUDI, UUD, PSN, ACK, NACK, SACK</text>
    <rect class="box" x="0" y="296" width="600" height="58" rx="6"/>
    <text class="label" x="300" y="321" text-anchor="middle">Congestion Management</text>
    <text class="small" x="300" y="340" text-anchor="middle">NSCC, RCCC, packet trimming</text>
    <rect class="box" x="0" y="370" width="600" height="58" rx="6"/>
    <text class="label" x="300" y="395" text-anchor="middle">IP Layer</text>
    <text class="small" x="300" y="414" text-anchor="middle">UDP/IP or raw IP encapsulation</text>
    <rect class="box" x="0" y="444" width="600" height="58" rx="6"/>
    <text class="label" x="300" y="469" text-anchor="middle">Ethernet Link Layer</text>
    <text class="small" x="300" y="488" text-anchor="middle">CBFC, LLR, PRI, LLDP capability negotiation</text>
    <rect class="soft" x="0" y="518" width="600" height="58" rx="6"/>
    <text class="label" x="300" y="543" text-anchor="middle">Ethernet PHY</text>
    <text class="small" x="300" y="562" text-anchor="middle">FEC statistics, 100G/200G lanes, link fault signaling</text>
  </g>
</svg>
