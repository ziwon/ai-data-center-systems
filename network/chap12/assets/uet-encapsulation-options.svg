<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">UET encapsulation options</title>
  <desc id="desc">UET UDP-based encapsulation, UDP with TSS security, and raw IP encapsulation using a UET entropy field.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: none; stroke: #D8D1C7; stroke-width: 1.2; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #050505; }
    .small { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #6F6A63; }
  </style>
  <rect class="bg" width="1120" height="620"/>
  <rect class="panel" x="42" y="40" width="1036" height="520" rx="8"/>
  <g transform="translate(82 88)">
    <rect class="box" x="0" y="0" width="300" height="420" rx="6"/>
    <text class="label" x="150" y="35" text-anchor="middle">UDP-based UET</text>
    <rect class="soft" x="50" y="72" width="200" height="42" rx="4"/>
    <text class="small" x="150" y="98" text-anchor="middle">Ethernet</text>
    <rect class="soft" x="50" y="122" width="200" height="42" rx="4"/>
    <text class="small" x="150" y="148" text-anchor="middle">IPv4 / IPv6</text>
    <rect class="accent" x="50" y="172" width="200" height="42" rx="4"/>
    <text class="small" x="150" y="198" text-anchor="middle">UDP dst 49150</text>
    <rect class="accent" x="50" y="222" width="200" height="42" rx="4"/>
    <text class="small" x="150" y="248" text-anchor="middle">UET PDS</text>
    <rect class="accent" x="50" y="272" width="200" height="42" rx="4"/>
    <text class="small" x="150" y="298" text-anchor="middle">UET SES</text>
    <rect class="soft" x="50" y="322" width="200" height="42" rx="4"/>
    <text class="small" x="150" y="348" text-anchor="middle">Payload</text>

    <rect class="box" x="350" y="0" width="300" height="420" rx="6"/>
    <text class="label" x="500" y="35" text-anchor="middle">UDP + TSS</text>
    <rect class="soft" x="400" y="72" width="200" height="42" rx="4"/>
    <text class="small" x="500" y="98" text-anchor="middle">Ethernet / IP / UDP</text>
    <rect class="accent" x="400" y="122" width="200" height="42" rx="4"/>
    <text class="small" x="500" y="148" text-anchor="middle">TSS header</text>
    <rect class="accent" x="400" y="172" width="200" height="42" rx="4"/>
    <text class="small" x="500" y="198" text-anchor="middle">UET PDS</text>
    <rect class="accent" x="400" y="222" width="200" height="42" rx="4"/>
    <text class="small" x="500" y="248" text-anchor="middle">UET SES</text>
    <rect class="soft" x="400" y="272" width="200" height="42" rx="4"/>
    <text class="small" x="500" y="298" text-anchor="middle">Payload</text>
    <rect class="accent" x="400" y="322" width="200" height="42" rx="4"/>
    <text class="small" x="500" y="348" text-anchor="middle">TSS ICV</text>

    <rect class="box" x="700" y="0" width="300" height="420" rx="6"/>
    <text class="label" x="850" y="35" text-anchor="middle">Raw IP UET</text>
    <rect class="soft" x="750" y="72" width="200" height="42" rx="4"/>
    <text class="small" x="850" y="98" text-anchor="middle">Ethernet</text>
    <rect class="soft" x="750" y="122" width="200" height="42" rx="4"/>
    <text class="small" x="850" y="148" text-anchor="middle">IPv4 / IPv6 protocol 253</text>
    <rect class="accent" x="750" y="172" width="200" height="42" rx="4"/>
    <text class="small" x="850" y="198" text-anchor="middle">Entropy field</text>
    <rect class="accent" x="750" y="222" width="200" height="42" rx="4"/>
    <text class="small" x="850" y="248" text-anchor="middle">UET PDS</text>
    <rect class="accent" x="750" y="272" width="200" height="42" rx="4"/>
    <text class="small" x="850" y="298" text-anchor="middle">UET SES</text>
    <rect class="soft" x="750" y="322" width="200" height="42" rx="4"/>
    <text class="small" x="850" y="348" text-anchor="middle">Payload</text>

    <text class="small" x="150" y="470" text-anchor="middle">Easiest brownfield fit</text>
    <text class="small" x="500" y="470" text-anchor="middle">Security hides inner fields</text>
    <text class="small" x="850" y="470" text-anchor="middle">Lighter, more UET-aware</text>
  </g>
</svg>
