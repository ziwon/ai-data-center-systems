<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Storage fabric redundancy design options</title>
  <desc id="desc">Physical A/B fabrics, logical A/B separation, collapsed fabric, and hybrid cloud replication options for AI storage networks.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .line { fill: none; stroke: #111111; stroke-width: 1.5; }
    .accent-line { fill: none; stroke: #D9392E; stroke-width: 2.2; }
    .muted-line { fill: none; stroke: #D8D1C7; stroke-width: 1.2; stroke-dasharray: 7 6; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #050505; }
    .small { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #6F6A63; }
    .head { font-family: Inter, Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #050505; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D9392E"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="640"/>

  <g transform="translate(60 68)">
    <rect class="soft" x="0" y="0" width="470" height="224" rx="8"/>
    <text class="head" x="235" y="34" text-anchor="middle">Physical Fabric A/B</text>
    <rect class="box" x="30" y="82" width="110" height="58" rx="6"/>
    <text class="label" x="85" y="116" text-anchor="middle">AI server</text>
    <rect class="box" x="190" y="56" width="95" height="54" rx="6"/>
    <text class="small" x="237.5" y="88" text-anchor="middle">Fabric A</text>
    <rect class="box" x="190" y="132" width="95" height="54" rx="6"/>
    <text class="small" x="237.5" y="164" text-anchor="middle">Fabric B</text>
    <rect class="box" x="340" y="56" width="100" height="54" rx="6"/>
    <text class="small" x="390" y="88" text-anchor="middle">Array A</text>
    <rect class="box" x="340" y="132" width="100" height="54" rx="6"/>
    <text class="small" x="390" y="164" text-anchor="middle">Array B</text>
    <path class="line" d="M140 102 C164 88 172 83 190 83" marker-end="url(#arrow)"/>
    <path class="accent-line" d="M140 120 C164 138 172 159 190 159" marker-end="url(#arrowAccent)"/>
    <path class="line" d="M285 83 H340" marker-end="url(#arrow)"/>
    <path class="accent-line" d="M285 159 H340" marker-end="url(#arrowAccent)"/>
    <text class="small" x="235" y="207" text-anchor="middle">Clear failure domains and equal-capacity backup fabric</text>

    <rect class="soft" x="530" y="0" width="470" height="224" rx="8"/>
    <text class="head" x="765" y="34" text-anchor="middle">Logical Fabric A/B</text>
    <rect class="box" x="560" y="82" width="110" height="58" rx="6"/>
    <text class="label" x="615" y="116" text-anchor="middle">AI server</text>
    <rect class="box" x="720" y="65" width="110" height="92" rx="6"/>
    <text class="small" x="775" y="96" text-anchor="middle">shared fabric</text>
    <text class="small" x="775" y="120" text-anchor="middle">A/B by policy</text>
    <rect class="box" x="880" y="56" width="90" height="54" rx="6"/>
    <text class="small" x="925" y="88" text-anchor="middle">Array 1</text>
    <rect class="box" x="880" y="132" width="90" height="54" rx="6"/>
    <text class="small" x="925" y="164" text-anchor="middle">Array 2</text>
    <path class="line" d="M670 103 H720" marker-end="url(#arrow)"/>
    <path class="accent-line" d="M670 121 C694 145 706 152 720 152" marker-end="url(#arrowAccent)"/>
    <path class="line" d="M830 94 H880" marker-end="url(#arrow)"/>
    <path class="accent-line" d="M830 139 H880" marker-end="url(#arrowAccent)"/>
    <text class="small" x="765" y="207" text-anchor="middle">Separated by EVPN, path attributes, and multipath drivers</text>

    <rect class="soft" x="0" y="282" width="470" height="224" rx="8"/>
    <text class="head" x="235" y="316" text-anchor="middle">Collapsed Fabric</text>
    <rect class="box" x="42" y="374" width="115" height="58" rx="6"/>
    <text class="label" x="99.5" y="408" text-anchor="middle">AI hosts</text>
    <rect class="accent" x="210" y="358" width="110" height="90" rx="6"/>
    <text class="label" x="265" y="394" text-anchor="middle">switch pair</text>
    <text class="small" x="265" y="418" text-anchor="middle">small site</text>
    <rect class="box" x="365" y="374" width="80" height="58" rx="6"/>
    <text class="small" x="405" y="408" text-anchor="middle">Storage</text>
    <path class="line" d="M157 403 H210" marker-end="url(#arrow)"/>
    <path class="accent-line" d="M320 403 H365" marker-end="url(#arrowAccent)"/>
    <text class="small" x="235" y="489" text-anchor="middle">Fits distributed inference, edge, and small sites</text>

    <rect class="soft" x="530" y="282" width="470" height="224" rx="8"/>
    <text class="head" x="765" y="316" text-anchor="middle">Hybrid Cloud Replication</text>
    <rect class="box" x="560" y="374" width="110" height="58" rx="6"/>
    <text class="small" x="615" y="397" text-anchor="middle">on-prem</text>
    <text class="small" x="615" y="416" text-anchor="middle">hot data</text>
    <rect class="accent" x="725" y="366" width="95" height="74" rx="6"/>
    <text class="label" x="772.5" y="397" text-anchor="middle">FW / GW</text>
    <text class="small" x="772.5" y="419" text-anchor="middle">IPsec/HTTPS</text>
    <rect class="box" x="875" y="374" width="95" height="58" rx="6"/>
    <text class="small" x="922.5" y="397" text-anchor="middle">cloud S3</text>
    <text class="small" x="922.5" y="416" text-anchor="middle">cold copy</text>
    <path class="line" d="M670 403 H725" marker-end="url(#arrow)"/>
    <path class="accent-line" d="M820 403 H875" marker-end="url(#arrowAccent)"/>
    <text class="small" x="765" y="489" text-anchor="middle">Combines local performance with cloud backup and archive</text>
  </g>
</svg>
