<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Deterministic routing planes for AI fabrics</title>
  <desc id="desc">A physical fabric is divided into logical path planes using BGP-DPF colors, RIFT topology awareness, or IS-IS FlexAlgo constraints.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .line { fill: none; stroke: #111111; stroke-width: 1.5; }
    .accent-line { fill: none; stroke: #D9392E; stroke-width: 2.2; }
    .muted-line { fill: none; stroke: #D8D1C7; stroke-width: 1.2; stroke-dasharray: 7 6; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #050505; }
    .small { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #6F6A63; }
    .key { font-family: Inter, Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #050505; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D9392E"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="640"/>

  <g transform="translate(76 72)">
    <rect class="soft" x="330" y="0" width="300" height="82" rx="6"/>
    <text class="key" x="480" y="34" text-anchor="middle">One physical fabric</text>
    <text class="small" x="480" y="58" text-anchor="middle">leaf-spine links, shared switch capacity, common failure domain</text>

    <rect class="box" x="0" y="170" width="255" height="120" rx="6"/>
    <text class="label" x="127.5" y="207" text-anchor="middle">BGP-DPF colors</text>
    <text class="small" x="127.5" y="232" text-anchor="middle">route/session color maps</text>
    <text class="small" x="127.5" y="252" text-anchor="middle">tenant, GPU ID, QP range,</text>
    <text class="small" x="127.5" y="272" text-anchor="middle">or SLA to a path group</text>

    <rect class="soft" x="352" y="170" width="255" height="120" rx="6"/>
    <text class="label" x="479.5" y="207" text-anchor="middle">RIFT topology logic</text>
    <text class="small" x="479.5" y="232" text-anchor="middle">northbound link-state,</text>
    <text class="small" x="479.5" y="252" text-anchor="middle">southbound distance-vector,</text>
    <text class="small" x="479.5" y="272" text-anchor="middle">automatic disaggregation</text>

    <rect class="box" x="704" y="170" width="255" height="120" rx="6"/>
    <text class="label" x="831.5" y="207" text-anchor="middle">IS-IS FlexAlgo</text>
    <text class="small" x="831.5" y="232" text-anchor="middle">FAD constraints compute</text>
    <text class="small" x="831.5" y="252" text-anchor="middle">latency, bandwidth, or</text>
    <text class="small" x="831.5" y="272" text-anchor="middle">low-congestion planes</text>

    <path class="line" d="M410 82 C310 112 224 136 151 170" marker-end="url(#arrow)"/>
    <path class="line" d="M480 82 V170" marker-end="url(#arrow)"/>
    <path class="line" d="M550 82 C653 112 747 139 809 170" marker-end="url(#arrow)"/>

    <g transform="translate(28 382)">
      <rect class="accent" x="0" y="0" width="190" height="70" rx="6"/>
      <text class="label" x="95" y="30" text-anchor="middle">Fabric Black</text>
      <text class="small" x="95" y="52" text-anchor="middle">Tenant / QP class A</text>

      <rect class="soft" x="245" y="0" width="190" height="70" rx="6"/>
      <text class="label" x="340" y="30" text-anchor="middle">Low latency</text>
      <text class="small" x="340" y="52" text-anchor="middle">collective-sensitive</text>

      <rect class="soft" x="490" y="0" width="190" height="70" rx="6"/>
      <text class="label" x="585" y="30" text-anchor="middle">High bandwidth</text>
      <text class="small" x="585" y="52" text-anchor="middle">elephant RDMA flows</text>

      <rect class="soft" x="735" y="0" width="190" height="70" rx="6"/>
      <text class="label" x="830" y="30" text-anchor="middle">Low congestion</text>
      <text class="small" x="830" y="52" text-anchor="middle">premium or protected jobs</text>
    </g>

    <path class="accent-line" d="M128 290 V382" marker-end="url(#arrowAccent)"/>
    <path class="muted-line" d="M479 290 C480 326 368 342 368 382" marker-end="url(#arrow)"/>
    <path class="muted-line" d="M832 290 C831 323 613 344 613 382" marker-end="url(#arrow)"/>
    <path class="muted-line" d="M832 290 C842 326 858 343 858 382" marker-end="url(#arrow)"/>

    <text class="small" x="480" y="530" text-anchor="middle">The common pattern is logical path separation over shared hardware. The control plane decides how flows enter each plane.</text>
  </g>
</svg>
