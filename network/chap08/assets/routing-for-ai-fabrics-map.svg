<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">Routing map for AI fabrics</title>
  <desc id="desc">A map of routing functions for AI fabrics: eBGP underlay, deterministic path forwarding, topology-aware IGPs, multi-tenancy, server routing, telemetry, and segment routing.</desc>
  <style>
    .bg { fill: #F5F1EA; }
    .panel { fill: none; stroke: #D8D1C7; stroke-width: 1.2; }
    .box { fill: #F5F1EA; stroke: #111111; stroke-width: 1.4; }
    .soft { fill: #F3EFE7; stroke: #D8D1C7; stroke-width: 1.2; }
    .accent { fill: #F5F1EA; stroke: #D9392E; stroke-width: 2; }
    .line { fill: none; stroke: #111111; stroke-width: 1.5; }
    .accent-line { fill: none; stroke: #D9392E; stroke-width: 2; }
    .muted-line { fill: none; stroke: #D8D1C7; stroke-width: 1.3; stroke-dasharray: 7 6; }
    .label { font-family: Inter, Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #050505; }
    .small { font-family: Inter, Arial, sans-serif; font-size: 12px; fill: #6F6A63; }
    .key { font-family: Inter, Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #050505; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#111111"/>
    </marker>
    <marker id="arrowAccent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D9392E"/>
    </marker>
  </defs>

  <rect class="bg" width="1120" height="560"/>
  <rect class="panel" x="40" y="36" width="1040" height="488" rx="8"/>

  <g transform="translate(82 82)">
    <rect class="accent" x="365" y="142" width="230" height="118" rx="6"/>
    <text class="key" x="480" y="181" text-anchor="middle">AI fabric routing</text>
    <text class="small" x="480" y="210" text-anchor="middle">reachability plus path control,</text>
    <text class="small" x="480" y="230" text-anchor="middle">scale, isolation, and telemetry</text>

    <rect class="box" x="0" y="20" width="205" height="92" rx="6"/>
    <text class="label" x="102.5" y="55" text-anchor="middle">eBGP underlay</text>
    <text class="small" x="102.5" y="79" text-anchor="middle">unnumbered, ASN plan,</text>
    <text class="small" x="102.5" y="98" text-anchor="middle">ADD-PATH, link bandwidth</text>

    <rect class="box" x="0" y="290" width="205" height="92" rx="6"/>
    <text class="label" x="102.5" y="325" text-anchor="middle">BGP-DPF</text>
    <text class="small" x="102.5" y="349" text-anchor="middle">tenant, GPU, QP,</text>
    <text class="small" x="102.5" y="368" text-anchor="middle">or SLA color mapping</text>

    <rect class="soft" x="378" y="0" width="205" height="92" rx="6"/>
    <text class="label" x="480.5" y="35" text-anchor="middle">RIFT / IS-IS</text>
    <text class="small" x="480.5" y="59" text-anchor="middle">topology-aware IGPs,</text>
    <text class="small" x="480.5" y="78" text-anchor="middle">FlexAlgo path planes</text>

    <rect class="box" x="755" y="20" width="205" height="92" rx="6"/>
    <text class="label" x="857.5" y="55" text-anchor="middle">Multi-tenancy</text>
    <text class="small" x="857.5" y="79" text-anchor="middle">EVPN-VXLAN, VRF,</text>
    <text class="small" x="857.5" y="98" text-anchor="middle">MIG, ACL policy</text>

    <rect class="soft" x="755" y="290" width="205" height="92" rx="6"/>
    <text class="label" x="857.5" y="325" text-anchor="middle">Server routing</text>
    <text class="small" x="857.5" y="349" text-anchor="middle">GPU hosts advertise</text>
    <text class="small" x="857.5" y="368" text-anchor="middle">service or host routes</text>

    <rect class="soft" x="378" y="318" width="205" height="92" rx="6"/>
    <text class="label" x="480.5" y="353" text-anchor="middle">SRv6 / controller TE</text>
    <text class="small" x="480.5" y="377" text-anchor="middle">explicit paths from</text>
    <text class="small" x="480.5" y="396" text-anchor="middle">telemetry and job intent</text>

    <path class="line" d="M205 66 C270 75 324 114 365 166" marker-end="url(#arrow)"/>
    <path class="line" d="M205 336 C279 316 323 275 365 235" marker-end="url(#arrow)"/>
    <path class="line" d="M480 92 V142" marker-end="url(#arrow)"/>
    <path class="line" d="M755 66 C685 80 634 116 595 166" marker-end="url(#arrow)"/>
    <path class="line" d="M755 336 C686 317 636 278 595 235" marker-end="url(#arrow)"/>
    <path class="accent-line" d="M480 318 V260" marker-end="url(#arrowAccent)"/>
  </g>

  <g transform="translate(84 488)">
    <text class="small" x="0" y="0">Routing is the control surface that turns topology, load balancing, congestion signals, and workload policy into forwarding behavior.</text>
  </g>
</svg>
