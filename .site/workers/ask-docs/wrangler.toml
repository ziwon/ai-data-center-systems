name = "adcs-ask-docs"
main = "src/index.js"
compatibility_date = "2026-06-28"

routes = [
  { pattern = "aidc.restack.tech/api/ask*", zone_name = "restack.tech" },
  { pattern = "aidc.restack.tech/api/kb*", zone_name = "restack.tech" },
  # Former hostname: every request is redirected to the new one.
  { pattern = "adcs.restack.tech/*", zone_name = "restack.tech" }
]

[vars]
ALLOWED_ORIGIN = "https://aidc.restack.tech"
WORKERS_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
RATE_LIMIT_REQUESTS = "20"
RATE_LIMIT_WINDOW_SECONDS = "3600"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ASK_DOCS_RATE_LIMIT"
id = "07322ffb079841da9811132d68d28bc4"

[[d1_databases]]
binding = "QA_DB"
database_name = "adcs-qa-logs"
database_id = "f7da8195-c401-4d79-977e-fa9641cacf77"
migrations_dir = "migrations"
